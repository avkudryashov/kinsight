syntax = "proto3";

package kinsight.v1;

option java_package = "app.kinsight.core.model.proto";

// Set by the admin at pairing (spec §4.8). Unspecified reads as PARENT: such a device never shares its own usage.
enum DeviceRole {
  DEVICE_ROLE_UNSPECIFIED = 0;
  PARENT = 1;
  CHILD = 2;
}

message SignedEntry {
  bytes body = 1;       // encoded EntryBody
  bytes signature = 2;  // Ed25519 over body bytes
}

message EntryBody {
  bytes group_id = 1;
  bytes author_id = 2;
  uint64 seq = 3;
  int64 created_at_ms = 4;  // informational only; never used for ordering
  uint64 lamport = 5;       // > every Lamport value the author had observed and > its own previous one
  oneof payload {
    UsageSummary usage_summary = 10;
    UsageDetail usage_detail = 11;
    AppCatalog app_catalog = 12;
    StateEvent state_event = 13;
    Heartbeat heartbeat = 14;
    MembershipOp membership_op = 15;
    CategoryOverride category_override = 16;  // protocol 2 (spec §4.4, stage 5c)
    CloudAccess cloud_access = 17;    // protocol 3: storage access for the members, sealed per device
    Location location = 18;           // protocol 3: one fix of a child's position
    SafeZone safe_zone = 19;          // protocol 3: a parent's safe zone
    StorageHandover storage_handover = 20;  // protocol 3: the storage owner asks a parent to take the storage (spec §7.1)
  }
}

message AppTotal {
  string package_name = 1;
  int64 foreground_ms = 2;
}

message UsageSummary {
  string local_date = 1;  // ISO yyyy-MM-dd in zone_id
  string zone_id = 2;
  int64 total_ms = 3;
  repeated AppTotal apps = 4;
  uint32 unlocks = 5;
}

message HourBucket {
  uint32 hour = 1;
  repeated AppTotal apps = 2;
  uint32 unlocks = 3;
}

message UsageDetail {
  string local_date = 1;
  string zone_id = 2;
  repeated HourBucket hours = 3;
}

message AppCatalog {
  string package_name = 1;
  string label = 2;
  bytes icon_webp = 3;
  int32 category = 4;
}

// A parent's category for an app, shared with the other parents (spec §4.4). One live entry per author and package
// (supersede key <author>/cat/<package>); the effective one is the active parent's with the highest
// (rank, author).
message CategoryOverride {
  string package_name = 1;
  int32 category = 2;  // AppCategory ordinal + 1; 0 = back to the default (override cleared)
  // The winner's rank + 1 at write time (0 without a winner), at most 2^20. Orders a later change after the choice it
  // replaces without raising anyone's Lamport clock (EntryAuthor observes membership Lamports only).
  int64 rank = 3;
}

message StateEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    SHARING_PAUSED = 1;
    SHARING_RESUMED = 2;
    USAGE_ACCESS_REVOKED = 3;
    USAGE_ACCESS_RESTORED = 4;
    CLOCK_CHANGED = 5;
    BLUETOOTH_OFF = 6;
    DATA_GAP = 7;
    LEFT_GROUP = 8;
    SYNC_STOPPED = 9;          // the user stopped sync on this device: from = stop, to = restart from the app
    NOTIFICATION_HIDDEN = 10;  // the sync notification cannot be seen (permission or channel off): from = detected
    NOTIFICATION_SHOWN = 11;   // it can be seen again: from = hidden since, to = now
    NEARBY_PERMISSION_OFF = 12;  // «Nearby devices» was revoked: from = noticed, to = granted again
    APP_FORCE_STOPPED = 13;      // the user force-stopped the app: from = the stop (system exit record), to = next start
    LOCATION_PERMISSION_OFF = 14;  // location (or background location) was revoked: from = noticed, to = granted again
    LOCATION_DISABLED = 15;        // location is off in the system settings: from = noticed, to = on again
    ZONE_ENTER = 16;               // the child entered safe zone zone_id at from
    ZONE_EXIT = 17;                // the child left safe zone zone_id at from
  }
  Kind kind = 1;
  int64 from_ms = 2;
  int64 to_ms = 3;
  int64 clock_shift_ms = 4;
  bytes zone_id = 5;  // ZONE_ENTER / ZONE_EXIT: SafeZone.zone_id
}

// Superseded by the author's next Heartbeat. The live set (audit A-2) is the author's signed statement: of its own seqs
// in (live_floor, live_upto] it still held exactly the listed ones when it signed; every other seq in that range was
// superseded or pruned there for good, so a receiver may account it. A Heartbeat without live_upto states nothing.
message Heartbeat {
  string app_version = 1;
  uint32 protocol_version = 2;
  uint64 live_upto = 3;
  uint64 live_floor = 4;
  repeated uint64 live_deltas = 5;  // ascending seqs: the first as a delta from live_floor, then from the previous
  // The storage generation (StorageOwner.generation) of this device's last successful cloud sync, 0 without the cloud.
  // The phone that replaced a token revokes the old one once every active member reports a higher one (spec §7).
  uint64 storage_generation = 6;
}

message CreateGroup {
  bytes salt = 1;
  bytes sign_public_key = 2;
  bytes dh_public_key = 3;
  string display_name = 4;
  DeviceRole role = 5;  // always PARENT from the app; CHILD makes the genesis invalid
}

message AddMember {
  bytes sign_public_key = 1;
  bytes dh_public_key = 2;
  string display_name = 3;
  DeviceRole role = 4;
  // The group key generation the adding admin handed the joiner at pairing (0 when absent: the key from pairing).
  uint32 group_key_epoch = 5;
}

message RemoveMember {
  bytes device_id = 1;
  uint64 last_seq = 2;
}

message SetAdmin {
  bytes device_id = 1;
  bool admin = 2;
  uint64 last_seq = 3;  // when admin = false: admin ops of target after this seq are void
}

message SealedKey {
  bytes device_id = 1;
  bytes enc = 2;
  bytes ciphertext = 3;
}

message RotateDiscoveryKey {
  uint32 epoch = 1;
  repeated SealedKey keys = 2;
}

message MembershipOp {
  oneof op {
    CreateGroup create = 1;
    AddMember add = 2;
    RemoveMember remove = 3;
    SetAdmin set_admin = 4;
    RotateDiscoveryKey rotate = 5;
    StorageOwner storage_owner = 6;  // protocol 3
  }
}

// The parent whose Yandex Disk holds the group's cloud storage (spec §4). Admin-only. The op with the highest generation
// wins (replay order breaks a tie); the target must be an active admin that is not a child.
message StorageOwner {
  bytes device_id = 1;
  bytes storage_id = 2;  // 16 random bytes, also the content of app:/Kinsight/<groupId>/storage.id
  uint64 generation = 3; // 1 for the first storage, +1 on every move to another Disk
}

// «Новый доступ» (spec §6, §7.4): the storage owner's access token for the members, one live entry per author
// (supersede key <author>/access). Valid from any parent; only the current StorageOwner's entry for the current storage
// generation is used. The token is a kinsight.v1.CloudGrant (cloud.proto) encrypted with the group key of key_epoch,
// never in clear; the refresh token is never put here.
message CloudAccess {
  uint64 generation = 1;
  bytes storage_id = 2;
  uint32 key_epoch = 3;   // group key generation (0 = the key from pairing, then MembershipOp.rotate epochs)
  bytes nonce = 4;        // 12 bytes
  bytes ciphertext = 5;   // ChaCha20-Poly1305 under the access key of that generation
}

// Spec §7.1 «Владелец выбирает родителя»: the storage owner asks the parent [to_device_id] to take the storage of
// [generation]. One live entry per author (supersede key <author>/handover). Only the current owner's entry for the
// current generation naming an active admin parent counts; any other is ignored when reading.
message StorageHandover {
  bytes to_device_id = 1;
  uint64 generation = 2;
}

// One fix of a child's position (spec §8). Inside a safe zone only zone_id is set (no coordinates leave the phone).
message Location {
  enum Provider {
    PROVIDER_UNSPECIFIED = 0;
    GPS = 1;
    NETWORK = 2;
    FUSED = 3;
    PASSIVE = 4;
  }
  sint32 lat_e7 = 1;       // degrees x 10^7
  sint32 lon_e7 = 2;
  uint32 accuracy_m = 3;
  int64 fix_time_ms = 4;   // android.location.Location.time; display only, never used for ordering
  Provider provider = 5;
  bytes zone_id = 6;       // set: "in zone zone_id", lat/lon/accuracy are 0
}

// A safe zone (spec §8.1), one live entry per author and zone (supersede key <author>/zone/<zone hex>). Parents only.
message SafeZone {
  bytes zone_id = 1;    // 16 random bytes
  string name = 2;
  sint32 lat_e7 = 3;
  sint32 lon_e7 = 4;
  uint32 radius_m = 5;
  bool deleted = 6;
  int64 rank = 7;       // as CategoryOverride.rank: orders an edit after the version it replaces
}
